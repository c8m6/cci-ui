name: certui
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: certui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certui}
      POSTGRES_DB: certui_development
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - certui
      interval: 5s
      timeout: 5s
      retries: 15
  consul:
    image: hashicorp/consul:1.22
    command:
    - agent
    - -server
    - -bootstrap-expect=1
    - -node=cci-local
    - -client=0.0.0.0
    - -data-dir=/consul/data
    volumes:
    - consul_data:/consul/data
    healthcheck:
      test:
      - CMD
      - consul
      - members
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build: .
    healthcheck:
      test:
      - CMD
      - ruby
      - bin/healthcheck
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    ports:
    - 127.0.0.1:${CCI_HTTP_PORT:-3000}:${CCI_CONTAINER_PORT:-3000}
    environment:
      RAILS_ENV: development
      CCI_CONFIG_FILE: /etc/cci/config.yml
    volumes:
    - type: bind
      source: ${CCI_CONFIG_FILE:-./config.yml}
      target: /etc/cci/config.yml
      read_only: true
      bind:
        create_host_path: false
    - ./data:/legacy:rw
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    build: .
    command:
    - ruby
    - bin/rails
    - db:prepare
    environment:
      RAILS_ENV: development
      CCI_CONFIG_FILE: /etc/cci/config.yml
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    volumes:
    - type: bind
      source: ${CCI_CONFIG_FILE:-./config.yml}
      target: /etc/cci/config.yml
      read_only: true
      bind:
        create_host_path: false
  indexer:
    build: .
    command:
    - ruby
    - bin/indexer
    environment:
      RAILS_ENV: development
      CCI_CONFIG_FILE: /etc/cci/config.yml
    volumes:
    - type: bind
      source: ${CCI_CONFIG_FILE:-./config.yml}
      target: /etc/cci/config.yml
      read_only: true
      bind:
        create_host_path: false
    - ./data:/legacy:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
volumes:
  postgres_data: null
  consul_data: null
