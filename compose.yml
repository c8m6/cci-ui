name: certui
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: certui
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-certui}
      POSTGRES_DB: certui_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "certui"]
      interval: 5s
      timeout: 5s
      retries: 15
  consul:
    image: hashicorp/consul:1.22
    command: ["agent", "-server", "-bootstrap-expect=1", "-node=cci-local", "-client=0.0.0.0", "-data-dir=/consul/data"]
    volumes:
      - consul_data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 5s
      timeout: 5s
      retries: 15
  web:
    build: .
    healthcheck:
      test: ["CMD", "ruby", "bin/healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    env_file:
      - path: ${CCI_ENV_FILE:-.env}
        required: false
    environment: &app_environment
      RAILS_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CCI_SHOW_ERROR_DETAILS: ${CCI_SHOW_ERROR_DETAILS:-false}
      AUTH_MODE: ${AUTH_MODE:-local}
      DATABASE_URL: postgresql://certui:${POSTGRES_PASSWORD:-certui}@db/certui_development
      TEST_DATABASE_URL: postgresql://certui:${POSTGRES_PASSWORD:-certui}@db/certui_test
      CONSUL_URL: http://consul:8500
      CONSUL_TOKEN: ${CONSUL_TOKEN:-}
      CONSUL_PREFIX: ${CONSUL_PREFIX:-cci}
      INDEX_INTERVAL: ${INDEX_INTERVAL:-60}
      CCI_CA_INVENTORY_ENABLED: ${CCI_CA_INVENTORY_ENABLED:-false}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CCI_AREAS: '${CCI_AREAS:-{"zone_a":"Zone A","zone_b":"Zone B"}}'
      CCI_LEGACY_PATHS: '${CCI_LEGACY_PATHS:-{"zone_a":"/legacy"}}'
      CCI_AREA_KEYS: ${CCI_AREA_KEYS:-}
      CSR_DEFAULT_KEY_ALGORITHM: ${CSR_DEFAULT_KEY_ALGORITHM:-RSA}
      CSR_DEFAULT_KEY_SIZE: ${CSR_DEFAULT_KEY_SIZE:-4096}
      CSR_DEFAULT_DIGEST: ${CSR_DEFAULT_DIGEST:-SHA512}
      CSR_DEFAULT_COUNTRY: ${CSR_DEFAULT_COUNTRY:-}
      CSR_DEFAULT_STATE: ${CSR_DEFAULT_STATE:-}
      CSR_DEFAULT_LOCALITY: ${CSR_DEFAULT_LOCALITY:-}
      CSR_DEFAULT_ORGANIZATION: ${CSR_DEFAULT_ORGANIZATION:-}
      CSR_DEFAULT_ORGANIZATIONAL_UNIT: ${CSR_DEFAULT_ORGANIZATIONAL_UNIT:-}
      CONSUL_CA_FILE: ${CONSUL_CA_FILE:-}
      PUPPETDB_ENABLED: ${PUPPETDB_ENABLED:-false}
      PUPPETDB_URL: ${PUPPETDB_URL:-}
      PUPPETDB_QUERY: ${PUPPETDB_QUERY:-}
      PUPPETDB_FACT_NAME: ${PUPPETDB_FACT_NAME:-certificates}
      PUPPETDB_FINGERPRINT_FIELD: ${PUPPETDB_FINGERPRINT_FIELD:-fingerprint}
      PUPPETDB_FINGERPRINT_ALGORITHM: ${PUPPETDB_FINGERPRINT_ALGORITHM:-sha256}
      PUPPETDB_CA_FILE: ${PUPPETDB_CA_FILE:-}
      PUPPETDB_CLIENT_CERT_FILE: ${PUPPETDB_CLIENT_CERT_FILE:-}
      PUPPETDB_CLIENT_KEY_FILE: ${PUPPETDB_CLIENT_KEY_FILE:-}
      PUPPETDB_TOKEN: ${PUPPETDB_TOKEN:-}
      PUPPETDB_TIMEOUT: ${PUPPETDB_TIMEOUT:-30}
      PUPPETDB_MAX_RESPONSE_BYTES: ${PUPPETDB_MAX_RESPONSE_BYTES:-52428800}
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
      PORT: ${PORT:-3000}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_ROLE_MAP: ${OIDC_ROLE_MAP:-{}}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-http://localhost:3000/auth/keycloak/callback}
    volumes:
      - ./data:/legacy:rw
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    build: .
    command: ["ruby", "bin/rails", "db:prepare"]
    env_file:
      - path: ${CCI_ENV_FILE:-.env}
        required: false
    environment: *app_environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  indexer:
    build: .
    command: ["ruby", "bin/indexer"]
    env_file:
      - path: ${CCI_ENV_FILE:-.env}
        required: false
    environment: *app_environment
    volumes:
      - ./data:/legacy:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: on-failure
volumes:
  postgres_data:
  consul_data:
