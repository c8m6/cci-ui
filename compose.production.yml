name: cci-ui-production
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cci
      POSTGRES_DB: cci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD setzen}
    volumes:
    - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - cci
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  web:
    healthcheck:
      test:
      - CMD
      - ruby
      - bin/healthcheck
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    build: .
    image: ${CCI_IMAGE:-cci-ui:local}
    ports:
    - 127.0.0.1:${CCI_HTTP_PORT:-3000}:${CCI_CONTAINER_PORT:-3000}
    environment:
      RAILS_ENV: production
      CCI_CONFIG_FILE: /etc/cci/config.yml
    volumes:
    - type: bind
      source: ${CCI_CONFIG_FILE:-./config.yml}
      target: /etc/cci/config.yml
      read_only: true
      bind:
        create_host_path: false
    - ${LEGACY_PATH:?LEGACY_PATH auf NFS-Mount setzen}:/legacy:rw
    - ${CCI_SECRETS_PATH:-./secrets}:/run/secrets:ro
    - ${CCI_TLS_PATH:-./tls}:/run/tls:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  migrate:
    image: ${CCI_IMAGE:-cci-ui:local}
    command:
    - ruby
    - bin/rails
    - db:prepare
    environment:
      RAILS_ENV: production
      CCI_CONFIG_FILE: /etc/cci/config.yml
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'
    volumes:
    - type: bind
      source: ${CCI_CONFIG_FILE:-./config.yml}
      target: /etc/cci/config.yml
      read_only: true
      bind:
        create_host_path: false
    - ${CCI_SECRETS_PATH:-./secrets}:/run/secrets:ro
    - ${CCI_TLS_PATH:-./tls}:/run/tls:ro
  indexer:
    image: ${CCI_IMAGE:-cci-ui:local}
    command:
    - ruby
    - bin/indexer
    environment:
      RAILS_ENV: production
      CCI_CONFIG_FILE: /etc/cci/config.yml
    volumes:
    - type: bind
      source: ${CCI_CONFIG_FILE:-./config.yml}
      target: /etc/cci/config.yml
      read_only: true
      bind:
        create_host_path: false
    - ${LEGACY_PATH:?LEGACY_PATH auf NFS-Mount setzen}:/legacy:ro
    - ${CCI_SECRETS_PATH:-./secrets}:/run/secrets:ro
    - ${CCI_TLS_PATH:-./tls}:/run/tls:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data: null
