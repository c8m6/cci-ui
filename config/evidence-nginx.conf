server {
    listen 443 ssl;
    server_tokens off;
    access_log off;

    ssl_certificate /run/evidence-tls/server.crt;
    ssl_certificate_key /run/evidence-tls/server.key;
    ssl_client_certificate /run/evidence-tls/client-ca.crt;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 32k;
    location = /v1/evidence {
        proxy_pass http://evidence:8080;
        proxy_set_header Authorization "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 15s;
        proxy_request_buffering on;
    }

    location / {
        return 404;
    }
}
