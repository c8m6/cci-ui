<% database = CciConfiguration.current.fetch("database") %>
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= CciConfiguration.current.dig("server", "threads") %>
  host: <%= database.fetch("host").to_json %>
  port: <%= database.fetch("port") %>
  database: <%= database.fetch("name").to_json %>
  username: <%= database.fetch("username").to_json %>
  password: <%= database.fetch("password").to_json %>
<% %w[sslmode sslrootcert sslcert sslkey].each do |key| %>
<% if database[key] %>
  <%= key %>: <%= database[key].to_json %>
<% end %>
<% end %>
  connect_timeout: 3
  checkout_timeout: 3

development:
  <<: *default
test:
  <<: *default
production:
  <<: *default
