# External PostgreSQL, Consul and OIDC; edit config.yml and mounts before use.
name: cci-ui-full
x-app: &app
  image: cci-ui:local
  environment:
    RAILS_ENV: production
    CCI_CONFIG_FILE: /etc/cci/config.yml
  volumes:
    - ./config.yml:/etc/cci/config.yml:ro
    - ./secrets:/run/secrets:ro
    - ./tls:/run/tls:ro
    - /srv/cci/legacy:/legacy:ro
services:
  migrate:
    <<: *app
    command: [ruby, bin/rails, 'db:prepare']
    restart: "no"
  web:
    <<: *app
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    volumes:
      - ./config.yml:/etc/cci/config.yml:ro
      - ./secrets:/run/secrets:ro
      - ./tls:/run/tls:ro
      - /srv/cci/legacy:/legacy:rw
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, ruby, bin/healthcheck]
      interval: 30s
      timeout: 10s
      retries: 3
  indexer:
    <<: *app
    command: [ruby, bin/indexer]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
