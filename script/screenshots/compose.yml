name: cci-ui-screenshots
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: screenshots
      POSTGRES_PASSWORD: screenshots
      POSTGRES_DB: screenshots
    tmpfs:
    - /var/lib/postgresql/data
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - screenshots
      interval: 2s
      timeout: 3s
      retries: 30
  consul:
    image: hashicorp/consul:1.22
    command:
    - agent
    - -dev
    - -client=0.0.0.0
    healthcheck:
      test:
      - CMD
      - consul
      - members
      interval: 2s
      timeout: 3s
      retries: 30
  puppetdb:
    build: ../..
    image: cci-ui-screenshots:local
    command:
    - bundle
    - exec
    - puma
    - -C
    - '-'
    - -b
    - tcp://0.0.0.0:8080
    - script/screenshots/puppetdb.ru
  web:
    build: ../..
    image: cci-ui-screenshots:local
    command:
    - sh
    - -c
    - ruby bin/rails db:prepare && ruby bin/rails runner script/screenshots/seed.rb
      && exec ruby bin/start
    ports:
    - 127.0.0.1:3001:3000
    environment:
      RAILS_ENV: development
      CCI_CONFIG_FILE: /app/script/screenshots/config.yml
    depends_on:
      puppetdb:
        condition: service_started
      db:
        condition: service_healthy
      consul:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - ruby
      - -rnet/http
      - -e
      - 'exit(Net::HTTP.get_response(URI(''http://127.0.0.1:3000/login'')).code ==
        ''200'' ? 0 : 1)'
      interval: 2s
      timeout: 5s
      retries: 60
