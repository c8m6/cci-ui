name: CI

on:
  push:
    branches: [main, dev, development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: certui
          POSTGRES_PASSWORD: certui-test
          POSTGRES_DB: certui_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U certui -d certui_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
      consul:
        image: hashicorp/consul:1.22
        command: agent -dev -client=0.0.0.0
        ports:
          - 8500:8500
        options: >-
          --health-cmd "consul members"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      RAILS_ENV: test
      CCI_CONFIG_FILE: test/config.yml
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Rails tests
        run: ruby bin/rails db:prepare test
      - name: RuboCop
        run: bundle exec rubocop --force-exclusion
      - name: Brakeman Rails security analysis
        run: bundle exec brakeman --no-pager --confidence-level 2
      - name: Audit locked Ruby dependencies
        run: bundle exec bundler-audit check --update
