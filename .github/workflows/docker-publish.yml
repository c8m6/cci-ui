name: Manual container release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example v1.5.0 or v1.5.0-rc.1)'
        required: true
        type: string
      dry_run:
        description: 'Validate and build without creating a tag, release or pushing the image'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: manual-container-release
  cancel-in-progress: false

jobs:
  app:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      security-events: write
    env:
      TEST_IMAGE: cci-ui:ci
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate release tag, source and uniqueness
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]] ||
            { echo 'Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-{alpha,beta,rc}.N' >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA" ||
            { echo 'Main changed since dispatch; start a new release from current main.' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" |
            jq -e --arg ref "refs/tags/$RELEASE_TAG" 'all(.[]; .ref != $ref)' > /dev/null ||
            { echo 'The release tag already exists.' >&2; exit 1; }
      - name: Resolve application build metadata
        run: |
          {
            echo "APP_VERSION=$RELEASE_TAG"
            echo "APP_REVISION=$(git rev-parse HEAD)"
            echo "APP_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "APP_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build application image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_REVISION=${{ env.APP_REVISION }}
            APP_BUILD_TIME=${{ env.APP_BUILD_TIME }}
            APP_SOURCE=${{ env.APP_SOURCE }}
          cache-from: type=gha,scope=cci-ui
          cache-to: type=gha,mode=max,scope=cci-ui
      - name: Prepare security report directory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mkdir -p tmp/security/sarif
      - uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1
        id: ruby
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Brakeman Rails security analysis
        if: ${{ !cancelled() && steps.ruby.outcome == 'success' }}
        run: |
          mkdir -p tmp/security
          bundle exec brakeman --no-pager --confidence-level 2 --output /dev/stdout --output tmp/security/brakeman.json --output tmp/security/sarif/brakeman.sarif
      - name: Audit locked Ruby dependencies
        if: ${{ !cancelled() && steps.ruby.outcome == 'success' }}
        run: |
          mkdir -p tmp/security
          bundle exec bundler-audit update
          bundle exec bundler-audit check --format json --output tmp/security/bundler-audit.json
        # Render the saved result even when the scan found vulnerabilities.
      - name: Display dependency audit results
        if: ${{ !cancelled() && hashFiles('tmp/security/bundler-audit.json') != '' }}
        run: |
          jq -r '.results | if length == 0 then "No vulnerabilities found" else .[] end' tmp/security/bundler-audit.json
      - name: Scan built image with Trivy
        id: trivy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.TEST_IMAGE }}
          timeout: 30m
          scanners: vuln
          vuln-type: os,library
          format: json
          output: tmp/security/trivy.json
          exit-code: '0'
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      - name: Render Trivy reports and enforce image security gate
        if: ${{ !cancelled() && steps.trivy.outcome == 'success' }}
        run: |
          trivy convert --format sarif --output tmp/security/sarif/trivy.sarif tmp/security/trivy.json
          trivy convert --format table tmp/security/trivy.json
          jq '.Results |= map(if .Vulnerabilities then .Vulnerabilities |= map(select(.FixedVersion != null and .FixedVersion != "")) else . end)' tmp/security/trivy.json > tmp/security/trivy-fixable.json
          trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 tmp/security/trivy-fixable.json
      - name: Retain security reports
        if: ${{ !cancelled() && hashFiles('tmp/security/*') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: tmp/security/
          retention-days: 14
      - name: Upload scanner SARIF to GitHub Security
        if: ${{ !cancelled() && hashFiles('tmp/security/sarif/*.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: tmp/security/sarif/
          category: cci-ui-security
      - name: Test image with PostgreSQL and Consul
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker compose -f compose.ci.yml up --wait db consul
          docker compose -f compose.ci.yml run --rm app ruby bin/rails db:prepare test
      - name: Stop test services
        if: always()
        run: docker compose -f compose.ci.yml down --volumes
      - name: Check Docker Hub configuration
        if: ${{ !inputs.dry_run }}
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set variable DOCKERHUB_USERNAME'; exit 1; }
          test -n "$DOCKERHUB_IMAGE" || { echo 'Set variable DOCKERHUB_IMAGE (namespace/repository)'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Set secret DOCKERHUB_TOKEN'; exit 1; }
      - name: Log in to Docker Hub
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Recheck main and create exact release tag
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$GITHUB_SHA" ||
            { echo 'Main changed during validation; refuse to publish.' >&2; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$RELEASE_TAG" |
            jq -e --arg ref "refs/tags/$RELEASE_TAG" 'all(.[]; .ref != $ref)' > /dev/null ||
            { echo 'The tag has been created concurrently.' >&2; exit 1; }
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
      - name: Publish tested application image
        if: ${{ !inputs.dry_run }}
        env:
          PUBLISH_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}:${{ inputs.tag }}
        run: |
          docker tag "$TEST_IMAGE" "$PUBLISH_IMAGE"
          docker push "$PUBLISH_IMAGE"
      - name: Fetch the newly created tag for release notes
        if: ${{ !inputs.dry_run }}
        run: git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
      - name: Generate notes from Conventional Commits
        if: ${{ !inputs.dry_run }}
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.13.1
          config: cliff.toml
          args: --current --strip all
          github_token: ${{ github.token }}
        env:
          OUTPUT: release-notes.md
      - name: Publish GitHub release after Docker Hub push
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          flags=(--verify-tag --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$RELEASE_TAG" "${flags[@]}"
      - name: Dry-run result
        if: ${{ inputs.dry_run }}
        run: echo "Release $RELEASE_TAG validated. Image built, scanned and integration-tested; no tag, release or Docker Hub push created."
