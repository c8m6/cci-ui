name: Build, test and publish containers

on:
  push:
    branches: [main, dev, development]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release_notes:
    name: Generate GitHub release notes
    if: github.event_name == 'release' && github.event.action == 'published'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - name: Generate notes from Conventional Commits
        uses: orhun/git-cliff-action@v4.8.0
        with:
          version: v2.13.1
          config: cliff.toml
          args: --current --strip all
          github_token: ${{ github.token }}
        env:
          OUTPUT: release-notes.md
      - name: Update published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes.md

  app:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    env:
      # Web and indexer share this one Dockerfile/image.
      TEST_IMAGE: cci-ui:ci
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          persist-credentials: false
      - name: Resolve application build metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          {
            if [ "$GITHUB_EVENT_NAME" = "release" ]; then
              test -n "$RELEASE_TAG"
              echo "APP_VERSION=$RELEASE_TAG"
            else
              echo "APP_VERSION=development"
            fi
            echo "APP_REVISION=$(git rev-parse HEAD)"
            echo "APP_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "APP_SOURCE=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          } >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: Build application image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            APP_REVISION=${{ env.APP_REVISION }}
            APP_BUILD_TIME=${{ env.APP_BUILD_TIME }}
            APP_SOURCE=${{ env.APP_SOURCE }}
          cache-from: type=gha,scope=cci-ui
          cache-to: type=gha,mode=max,scope=cci-ui
      - name: Prepare security report directory
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: mkdir -p tmp/security/sarif
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        id: ruby
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Brakeman Rails security analysis
        if: ${{ !cancelled() && steps.ruby.outcome == 'success' }}
        run: |
          mkdir -p tmp/security
          bundle exec brakeman --no-pager --confidence-level 2 --output /dev/stdout --output tmp/security/brakeman.json --output tmp/security/sarif/brakeman.sarif
      - name: Audit locked Ruby dependencies
        if: ${{ !cancelled() && steps.ruby.outcome == 'success' }}
        run: |
          mkdir -p tmp/security
          bundle exec bundler-audit update
          bundle exec bundler-audit check --format json --output tmp/security/bundler-audit.json
        # Render the saved result even when the scan found vulnerabilities.
      - name: Display dependency audit results
        if: ${{ !cancelled() && hashFiles('tmp/security/bundler-audit.json') != '' }}
        run: |
          jq -r '.results | if length == 0 then "No vulnerabilities found" else .[] end' tmp/security/bundler-audit.json
      - name: Scan built image with Trivy
        id: trivy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ${{ env.TEST_IMAGE }}
          timeout: 30m
          scanners: vuln
          vuln-type: os,library
          format: json
          output: tmp/security/trivy.json
          exit-code: '0'
          ignore-unfixed: false
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
      - name: Render Trivy reports and enforce image security gate
        if: ${{ !cancelled() && steps.trivy.outcome == 'success' }}
        run: |
          trivy convert --format sarif --output tmp/security/sarif/trivy.sarif tmp/security/trivy.json
          trivy convert --format table tmp/security/trivy.json
          jq '.Results |= map(if .Vulnerabilities then .Vulnerabilities |= map(select(.FixedVersion != null and .FixedVersion != "")) else . end)' tmp/security/trivy.json > tmp/security/trivy-fixable.json
          trivy convert --format table --severity HIGH,CRITICAL --exit-code 1 tmp/security/trivy-fixable.json
      - name: Retain security reports
        if: ${{ !cancelled() && hashFiles('tmp/security/*') != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: security-reports
          path: tmp/security/
          retention-days: 14
      - name: Upload scanner SARIF to GitHub Security
        # Fork PRs retain downloadable artifacts without requiring a write token.
        if: >-
          ${{ !cancelled() && hashFiles('tmp/security/sarif/*.sarif') != '' &&
              (github.event_name != 'pull_request' ||
               github.event.pull_request.head.repo.full_name == github.repository) &&
              github.actor != 'dependabot[bot]' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: tmp/security/sarif/
          category: cci-ui-security
      - name: Test image with PostgreSQL and Consul
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          docker compose -f compose.ci.yml up --wait db consul
          docker compose -f compose.ci.yml run --rm app ruby bin/rails db:prepare test
      - name: Stop test services
        if: always()
        run: docker compose -f compose.ci.yml down --volumes
      - name: Check Docker Hub configuration
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set variable DOCKERHUB_USERNAME'; exit 1; }
          test -n "$DOCKERHUB_IMAGE" || { echo 'Set variable DOCKERHUB_IMAGE (namespace/repository)'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Set secret DOCKERHUB_TOKEN'; exit 1; }
      - name: Log in to Docker Hub
        if: github.event_name == 'release' && github.event.action == 'published'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested application image
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          PUBLISH_IMAGE: ${{ vars.DOCKERHUB_IMAGE }}:${{ github.event.release.tag_name }}
        run: |
          docker tag "$TEST_IMAGE" "$PUBLISH_IMAGE"
          docker push "$PUBLISH_IMAGE"
