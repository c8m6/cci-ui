name: cci-ui-ci
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: certui
      POSTGRES_PASSWORD: certui-test
      POSTGRES_DB: certui_test
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - certui
      - -d
      - certui_test
      interval: 2s
      timeout: 5s
      retries: 30
  consul:
    image: hashicorp/consul:1.22
    command:
    - agent
    - -dev
    - -client=0.0.0.0
    healthcheck:
      test:
      - CMD
      - consul
      - members
      interval: 2s
      timeout: 5s
      retries: 30
  app:
    image: ${TEST_IMAGE:-cci-ui:ci}
    environment:
      RAILS_ENV: test
      CCI_CONFIG_FILE: /app/test/container.yml
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_healthy
