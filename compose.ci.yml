# Isolated, disposable test services; no production secrets or legacy mounts.
name: cci-ui-ci
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: certui
      POSTGRES_PASSWORD: certui-test
      POSTGRES_DB: certui_test
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "certui", "-d", "certui_test"]
      interval: 2s
      timeout: 5s
      retries: 30
  consul:
    image: hashicorp/consul:1.22
    command: ["agent", "-dev", "-client=0.0.0.0"]
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 2s
      timeout: 5s
      retries: 30
  app:
    image: ${TEST_IMAGE:-cci-ui:ci}
    environment:
      RAILS_ENV: test
      AUTH_MODE: local
      DATABASE_URL: postgresql://certui:certui-test@db/certui_test
      TEST_DATABASE_URL: postgresql://certui:certui-test@db/certui_test
      CONSUL_URL: http://consul:8500
      LEGACY_PATH: /nonexistent
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_healthy
